server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:6542/store
    username: store
    password: 12345
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none
      properties:
        hibernate.format_sql: true
        hibernate.show_sql: true